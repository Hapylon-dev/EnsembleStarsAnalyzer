const markdown = "# ensemble-stars-analyzer\n\n**あんさんぶるスターズ！！Music タップタイミング解析Webアプリ**\n\n**Version 3.3.3-dev（2026年11月11日）**\n\nあんさんぶるスターズ！！Musicのライブリザルト画像を解析し、タップタイミングの傾向や本アプリ独自の評価を確認できるWebアプリです。\n\nリザルト画像をアップロードし、楽曲情報を入力するだけで、判定分布の推定、Precision、Balance、Overall Score、Rank、ランキングなどを確認できます。\n\n> ⚠️ 本ツールは非公式ファンメイドツールです。  \n> Happy Elements株式会社とは関係ありません。\n\n---\n\n## 🌟 Webアプリ\n\n**Webアプリ：**\n\nhttps://ensemble-stars-analyzer.streamlit.app/\n\n現在、無料で利用でき、会員登録は必要ありません。\n\nスマートフォン・タブレット・PCのブラウザから利用できます。\n\n---\n\n## 😴 アプリがスリープしている場合\n\nこのWebアプリは、しばらく利用されていないと、一時的にスリープ状態になることがあります。\n\nスリープ画面が表示された場合は、次の手順でアプリを起動してください。\n\n### STEP 1：スリープ解除ボタンを押す\n\n画面に表示される **`Yes, get this app back up!`** ボタンをクリックまたはタップしてください。\n\n### STEP 2：起動するまで待つ\n\n`This will take just a sec! Your app is waking up!` と表示された場合は、アプリが起動するまでそのままお待ちください。\n\n起動には少し時間がかかることがあります。\n\n### STEP 3：通常の画面が表示されたら利用を再開する\n\nアプリの画面が表示されたら、通常どおりリザルト画像をアップロードして解析できます。\n\n### うまく起動しない場合\n\n`Hmm... looks like it's taking longer than normal.` と表示された場合は、少し時間をおいてから再度アクセスしてください。\n\nそれでも起動しない場合は、ページを再読み込みして、もう一度お試しください。\n\n---\n\n## 📌 解析値について\n\nタップタイミング解析は、対象条件を満たすALL AMAZING相当のリザルト画像を対象とします。棒グラフの高さから判定数を推定するため、表示値は実数ではなく参考値です。既存のスコア計算式は維持しています。\n\n---\n\n# 📖 まず最初に\n\nこのマニュアルでは、**実際にアプリを使う手順**を中心に説明します。\n\n特に初めて利用する場合は、次の順番で確認してください。\n\n1. 解析できるリザルト画像を用意する\n2. リザルト画像をアップロードする\n3. 楽曲名・難易度・レベル・総ノーツ数を入力する\n4. 「解析開始」を押す\n5. 解析結果を確認する\n6. リザルトカードを保存する\n7. 必要に応じてXで共有する\n8. 総合評価ランキングとランキング称号を確認する\n\n---\n\n# 🎮 1．解析できるリザルト画像\n\n解析する前に、使用するスクリーンショットが条件を満たしているか確認してください。\n\n## 対応しているリザルト\n\n現在の対象は、**新ライブUI（2025年4月29日以降）のライブリザルト画面**です。\n\n対応しているライブは以下です。\n\n- ライブチャレンジ\n- ノーマルライブ\n- あんさんぶるライブ\n- ソロライブ\n\nただし、ライブの種類によって対象となるリザルト表示が異なります。\n\n### ライブチャレンジ\n\nリザルト画面に、\n\n**ALL AMAZING（100.000%）**\n\nと表示されているリザルトが対象です。\n\n### ノーマルライブ・あんさんぶるライブ・ソロライブ\n\nリザルト画面に、\n\n**PERFECT COMBO**\n\nと表示されているリザルトが対象です。\n\nこれらのライブでは画面上に「AMAZING」が最高判定として表示されないため、タップタイミング棒グラフから内部的なALL AMAZING相当かを判断します。\n\n---\n\n## 画像の条件\n\n次の条件をすべて満たす画像を使用してください。\n\n- ゲーム内のライブリザルト画面のスクリーンショット\n- 新ライブUI（2025年4月29日以降）\n- 編集・加工していない画像\n- 十分な解像度がある画像\n- タップタイミング棒グラフがはっきり表示されている\n- 棒グラフが中央1本＋左右各1本の合計3本以内に収まっている\n- ALL AMAZING相当の結果\n- MISSがない\n- 総ノーツ数と最高判定数が一致している\n\n### 棒グラフを見るときのポイント\n\nタップタイミング棒グラフは、**中央に近いほど正確なタイミング**を表します。\n\n対象となるAMAZING判定の棒は、\n\n- 中央\n- 中央の左\n- 中央の右\n\nの最大3本です。\n\n棒グラフが途中で切れている、ぼやけている、加工されている画像では、正しく解析できない場合があります。\n\n### MISSについて\n\nMISSはタップタイミング棒グラフには表示されません。\n\nそのため、リザルト画面を見て、\n\n**総ノーツ数と最高判定数が一致していること**\n\nも確認してください。\n\n> ⚠️ 条件を満たさない画像は解析対象外です。  \n> 条件を満たしていても、画像の状態によって正しく解析できない場合があります。\n\n---\n\n# 📷 2．リザルト画像をアップロードする\n\nWebアプリを開くと、リザルト画像をアップロードする欄があります。\n\n対応している画像形式は、\n\n- PNG\n- JPG\n- JPEG\n- WebP\n\nです。\n\n画像をアップロードすると、入力画面の下に**「解析対象となるリザルト画像」**としてアップロードした画像が表示されます。\n\nアップロードした画像を見て、正しいリザルト画像になっていることを確認してください。\n\n### ファイルサイズ\n\nアップロードできる画像は**最大20MB**です。\n\n20MBを超える画像は解析できません。\n\n---\n\n# 🎼 3．楽曲情報を入力する\n\n画像をアップロードしたら、画像に表示されている楽曲情報を入力します。\n\n## 楽曲名\n\nゲームのリザルト画面に表示されている曲名を入力してください。\n\n最大**50文字**まで入力できます。\n\n---\n\n## 難易度\n\n以下から選択します。\n\n- Easy\n- Normal\n- Hard\n- Expert\n- Special\n\nリザルト画面と同じ難易度を選択してください。\n\n---\n\n## レベル\n\n選択した難易度に応じて、入力できるレベルが変わります。\n\n| 難易度 | 選択できるレベル |\n|---|---|\n| Easy | 5～10 |\n| Normal | 11～17 |\n| Hard | 17～26 |\n| Expert | 23、24、25、26、26+、27、27+、28、28+、29、29+、30、30+ |\n| Special | 26、26+、27、27+、28、28+、29、29+、30、30+、31、31+、♪1～♪6 |\n\n> ※ Expert・Specialでは「+」付きのレベルや「♪」表記のレベルも選択できます。\n\n---\n\n## 🔢 総ノーツ数\n\n**ゲームのリザルト画面に表示されている総ノーツ数を、そのまま入力してください。**\n\n入力範囲は、\n\n**60～1800**\n\nです。\n\n総ノーツ数は非常に重要です。\n\n本ツールでは、棒グラフから判定分布を推定したあと、その割合を入力された総ノーツ数に換算します。\n\nそのため、総ノーツ数を間違えると、推定される判定数やAchievementなどの結果も正しくならない場合があります。\n\n> ⚠️ 総ノーツ数は必ずリザルト画面の表示を確認して入力してください。\n\n---\n\n# ▶️ 4．解析を開始する\n\n入力が終わったら、\n\n**「▶ 解析開始」**\n\nを押してください。\n\n解析では、\n\n1. リザルト画像を読み込む\n2. タップタイミング棒グラフを解析する\n3. 判定分布を推定する\n4. 各種評価を計算する\n5. リザルトカードを生成する\n6. ランキングを計算する\n\nという処理が行われます。\n\n解析が完了すると、\n\n**「✅ 解析が正常に完了しました。」**\n\nと表示され、結果を確認できます。\n\n---\n\n# 📊 5．解析結果の見方\n\n## 判定分布\n\nリザルト画面のタップタイミング棒グラフから、判定数を推定します。\n\n主に次の項目を確認できます。\n\n- AMAZING+\n- AMAZING\n- PERFECT\n- FAST\n- SLOW\n\nここで表示される判定数は、**ゲーム内部の正式な判定データではなく、画像から推定した値**です。\n\nそのため、ゲーム公式の内部データと完全に一致することを保証するものではありません。\n\n---\n\n## 🏆 Achievement\n\n本ツール独自の達成率です。\n\n表示は小数点以下3桁までです。\n\n理論上の最大値は、\n\n**101.000%**\n\nです。\n\nAchievementはゲーム公式のCHALLENGE RATE値ではありません。\n\n---\n\n## 🎯 Precision（精密度）\n\nタップタイミングの**ばらつきの少なさ**を表す、本ツール独自の指標です。\n\n数値が高いほど、中央付近にタップタイミングが集まっていると評価されます。\n\n表示範囲：\n\n**0～100%**\n\nPrecisionにはS～Fのグレードも表示されます。\n\n### Precisionのグレード\n\n| Precision | グレード |\n|---:|:---|\n| 88%以上 | SSS |\n| 86%以上 | SS |\n| 84%以上 | S |\n| 82%以上 | AAA |\n| 80%以上 | AA |\n| 78%以上 | A |\n| 76%以上 | BBB |\n| 74%以上 | BB |\n| 72%以上 | B |\n| 70%以上 | CCC |\n| 68%以上 | CC |\n| 64%以上 | C |\n| 60%以上 | D |\n| 56%以上 | E |\n| 56%未満 | F |\n\n---\n\n## ⚖️ Balance（安定度）\n\nSLOWとFASTの**偏りの少なさ**を表す、本ツール独自の指標です。\n\nSLOWとFASTの割合が近いほど高く評価されます。\n\n表示範囲：\n\n**0～100%**\n\n### Balanceのグレード\n\n| Balance | グレード |\n|---:|:---|\n| 98%以上 | SSS |\n| 94%以上 | SS |\n| 88%以上 | S |\n| 82%以上 | AAA |\n| 74%以上 | AA |\n| 64%以上 | A |\n| 56%以上 | BBB |\n| 48%以上 | BB |\n| 42%以上 | B |\n| 36%以上 | CCC |\n| 30%以上 | CC |\n| 24%以上 | C |\n| 18%以上 | D |\n| 12%以上 | E |\n| 12%未満 | F |\n\n---\n\n## ⭐ Overall Score（総合評価）\n\nPrecisionとBalanceをもとに算出する、本ツール独自の総合評価です。\n\n数値が高いほど、総合的に良い結果として評価されます。\n\n現在の評価では、\n\n- Precision：80%\n- Balance：20%\n\nの割合でOverall Scoreを算出します。\n\n---\n\n## 🏅 Rank\n\nOverall Scoreに応じて、本ツール独自のRankが決まります。\n\n| Overall Score | Rank |\n|---:|:---|\n| 86以上 | SSS+ |\n| 84～85.999 | SSS |\n| 82～83.999 | SS+ |\n| 80～81.999 | SS |\n| 78～79.999 | S+ |\n| 76～77.999 | S |\n| 74～75.999 | AAA+ |\n| 72～73.999 | AAA |\n| 70～71.999 | AA+ |\n| 68～69.999 | AA |\n| 66～67.999 | A+ |\n| 64～65.999 | A |\n| 62～63.999 | BBB |\n| 60～61.999 | BB |\n| 58～59.999 | B |\n| 56～57.999 | CCC |\n| 54～55.999 | CC |\n| 52～53.999 | C |\n| 50～51.999 | D |\n| 48～49.999 | E |\n| 0～47.999 | F |\n\n> ⚠️ Rankは本ツール独自の評価です。ゲーム公式のランクではありません。\n\n---\n\n# 📈 6．1799件の基準データの分布\n\n本ツールのランキングで使用している**1,799件の基準データ**について、Overall Score、Precision、Balanceの分布を参考として掲載しています。\n\nこれらのグラフは、基準データの各評価ランクに何件の結果が含まれているかを示したものです。\n\n## ⚖️ Balance（安定度）の分布\n\n1799件の基準データにおけるBalanceランク別の分布です。\n\n\u003cp align=\"center\">\n  \u003cimg src=\"assets/balance.png\" alt=\"Balanceの分布\" width=\"700\">\n\u003c/p>\n\n---\n\n## ⭐ Overall Score（総合評価）の分布\n\n1799件の基準データにおけるOverall Scoreランク別の分布です。\n\n\u003cp align=\"center\">\n  \u003cimg src=\"assets/overall_score.png\" alt=\"Overall Scoreの分布\" width=\"700\">\n\u003c/p>\n\n---\n\n## 🎯 Precision（精密度）の分布\n\n1799件の基準データにおけるPrecisionランク別の分布です。\n\n\u003cp align=\"center\">\n  \u003cimg src=\"assets/precision.png\" alt=\"Precisionの分布\" width=\"700\">\n\u003c/p>\n\n---\n\n# 🖼️ 7．リザルトカード\n\n解析が完了すると、解析結果をまとめたリザルトカードが表示されます。\n\nリザルトカードには、主に以下の情報がまとめられています。\n\n### 楽曲情報\n\n- 楽曲名\n- 難易度\n- レベル\n\n### 判定情報\n\n- AMAZING+\n- AMAZING\n- PERFECT\n- GREAT\n- GOOD\n- BAD\n- MISS\n\n### 評価\n\n- Achievement\n- Precision\n- Precisionグレード\n- Balance\n- Balanceグレード\n- Overall Score\n- Rank\n\n### SLOW / FAST\n\nリザルトカード下部には、\n\n**SLOW / FAST**\n\nをまとめて表示します。\n\nそれぞれのノーツ数と、全判定数に対する割合を確認できます。\n\n### プレイ傾向\n\nPrecision、Balance、SLOW / FASTなどをもとに、現在のプレイ傾向を確認できます。\n\n### 解析コメント\n\n解析結果をもとに、プレイ傾向や評価についてのコメントが表示されます。\n\n### 総合評価ランキング\n\nリザルトカードには、今回の結果について、\n\n- 順位\n- 上位何%か\n- ランキング称号\n- Overall Scoreの分布\n- 現在の自分の位置\n\nなどを確認できるランキング結果も含まれます。\n\n---\n\n# 💾 8．リザルトカードを保存する\n\n解析結果の下にある、\n\n**「📥 リザルトカードを保存」**\n\nを押すと、リザルトカードをPNG画像として保存できます。\n\n保存されるファイル名は、\n\n`楽曲名_ResultCard.png`\n\nという形式です。\n\n保存した画像は、SNSなどで共有できます。\n\n---\n\n# 𝕏 9．Xで解析結果を共有する\n\n解析結果の下には、\n\n**「𝕏 結果を共有」**\n\nボタンがあります。\n\nこのボタンを押すと、解析結果をもとにしたX投稿画面を開けます。\n\n## 投稿される主な情報\n\n- 楽曲名\n- 難易度\n- レベル\n- AMAZING+\n- AMAZING\n- FAST\n- SLOW\n- Achievement\n- Precision\n- Balance\n- Overall Score\n- Rank\n- ランキング順位\n- 上位○%\n- WebアプリURL\n- ハッシュタグ\n\n### 曲名について\n\nX投稿では曲名を最大20文字まで使用します。\n\n投稿全体が250文字を超える場合は、投稿全体が収まるように曲名がさらに短縮されます。\n\n長い曲名は末尾が「…」になります。\n\n### 画像について\n\nX共有機能は**解析結果をもとにした投稿文とWebアプリURLを作成する機能**です。\n\nアップロードしたリザルト画像そのものをXへ自動投稿する機能はありません。\n\n> ⚠️ Xへ投稿する前に、表示された投稿内容を確認してください。\n\n---\n\n# 🏆 10．総合評価ランキング\n\n解析結果では、Overall Scoreをもとにした本ツール独自のランキングを確認できます。\n\nランキングは、\n\n**固定された1,799件の基準データ**\n\nと今回の解析結果を比較して計算します。\n\n今回の解析結果を加えると、画面上では、\n\n**1,800件**\n\nとして表示されます。\n\n### ランキングの見方\n\nランキング画面では、\n\n- 順位\n- Overall Score\n- Rank\n- Precision\n- Balance\n- プレイ傾向\n\nなどを確認できます。\n\n現在の解析結果には、\n\n**★あなた**\n\nと表示されます。\n\n### ページ\n\nランキングは1ページ50件で表示され、\n\n**全36ページ**\n\nあります。\n\nページ番号を入力して移動したり、「前のページ」「次のページ」で移動したりできます。\n\n### ランキングデータについて\n\n今回の解析結果は、ランキング基準データへ保存・追加されません。\n\nつまり、同じ結果を何度解析しても、それによってランキング基準データ自体が増える仕組みではありません。\n\nランキングは固定された基準データとの比較結果として表示されます。\n\n### ランキングの基準日\n\n現在のランキング基準データは **2026年8月25日時点** のデータです。\n\nランキングは今後のデータ追加・更新によって変動する可能性があります。\n\n> ⚠️ このランキングは本ツール独自のランキングです。  \n> 『あんさんぶるスターズ！！Music』公式のランキングではありません。\n\n---\n\n# 🏅 11．ランキング称号\n\nランキング順位の**上位率（%）**に応じて、本ツール独自のランキング称号が決まります。\n\n**上位率は数値が小さいほど上位**です。  \nたとえば「上位10%」は、ランキング全体の上位10%以内を意味します。\n\n現在の称号は以下の12種類です。\n\n| 絵文字 | ランキング称号 | ボーダー（上位率） |\n|:---:|---|---:|\n| 🌈 | レインボーランカー | **上位5%以内** |\n| 💎 | ダイヤモンドランカー | **上位10%以内** |\n| 🤍 | プラチナランカー | **上位15%以内** |\n| 💛 | ゴールドランカー | **上位20%以内** |\n| 🩶 | シルバーランカー | **上位25%以内** |\n| 🤎 | ブロンズランカー | **上位30%以内** |\n| 🟣 | パープルランカー | **上位50%以内** |\n| 🔴 | レッドランカー | **上位60%以内** |\n| 🟠 | オレンジランカー | **上位70%以内** |\n| 🟢 | グリーンランカー | **上位80%以内** |\n| 🔵 | ブルーランカー | **上位90%以内** |\n| ⚪ | ホワイトランカー | **上位100%以内** |\n\n### 称号の決まり方\n\n上位率を上位から順に判定し、最初に該当するボーダーの称号が表示されます。\n\nたとえば、\n\n- **上位4.0%** → 🌈 レインボーランカー\n- **上位7.5%** → 💎 ダイヤモンドランカー\n- **上位14.0%** → 🤍 プラチナランカー\n- **上位18.0%** → 💛 ゴールドランカー\n- **上位24.0%** → 🩶 シルバーランカー\n- **上位29.0%** → 🤎 ブロンズランカー\n- **上位45.0%** → 🟣 パープルランカー\n- **上位55.0%** → 🔴 レッドランカー\n- **上位65.0%** → 🟠 オレンジランカー\n- **上位75.0%** → 🟢 グリーンランカー\n- **上位85.0%** → 🔵 ブルーランカー\n- **上位95.0%** → ⚪ ホワイトランカー\n\nという判定になります。\n\n> ⚠️ ランキング称号は本ツール独自のものです。  \n> 『あんさんぶるスターズ！！Music』公式の称号・ランキングではありません。\n\n> 📌 ランキングの基準データは固定されています。  \n> 現在は1,799件の基準データと今回の解析結果を比較し、画面上では1,800件として表示します。\n\n# 📷 12．実際の画面\n\n実際のWebアプリの画面やリザルトカードを紹介します。\n\n## Webアプリ入力画面\n\nリザルト画像をアップロードし、楽曲名・難易度・レベル・総ノーツ数を入力する画面です。\n\n\u003cp align=\"center\">\n  \u003cimg src=\"assets/webapp_input.png\" alt=\"Webアプリ入力画面\" width=\"700\">\n\u003c/p>\n\n---\n\n## 解析結果・リザルトカード\n\n解析完了後に表示されるリザルトカードです。\n\n判定分布、Achievement、Precision、Balance、Overall Score、Rank、SLOW / FAST、ランキングなどをまとめて確認できます。\n\n\u003cp align=\"center\">\n  \u003cimg src=\"assets/result_card.png\" alt=\"解析結果・リザルトカード\" width=\"500\">\n\u003c/p>\n\n---\n\n## ランキング称号一覧\n\nランキングの上位率に応じて表示される12種類のランキング称号です。\n\n\u003cp align=\"center\">\n  \u003cimg src=\"assets/ranking_titles.png\" alt=\"ランキング称号一覧\" width=\"700\">\n\u003c/p>\n\n---\n\n# ✅ 13．利用前に特に確認してほしいこと\n\n初めて利用する場合は、次の4点を確認すると解析に失敗しにくくなります。\n\n1. **新ライブUI（2025年4月29日以降）のリザルト画像を使用する**\n2. **タップタイミング棒グラフがはっきり見える画像を使用する**\n3. **総ノーツ数をリザルト画面の表示どおりに入力する**\n4. **画像を編集・加工せず、そのままアップロードする**\n\n特に、総ノーツ数は推定された判定割合をノーツ数へ換算するために使用されます。入力を間違えると、判定数やAchievementなどの結果に影響します。\n\n---\n\n# ❓ 14．よくある質問\n\n## Q．このツールは無料ですか？\n\nはい。現在、無料で利用できます。\n\n会員登録も必要ありません。\n\n## Q．スマートフォンから利用できますか？\n\nはい。\n\nスマートフォンのブラウザからリザルト画像をアップロードして利用できます。\n\n## Q．どんな画像でも解析できますか？\n\nいいえ。\n\n新ライブUIの対応リザルトで、タップタイミング棒グラフが明確に表示されている画像を使用してください。\n\n特に、編集・加工された画像や解像度の低い画像では正しく解析できない場合があります。\n\n## Q．総ノーツ数はなぜ入力するのですか？\n\n棒グラフから推定した割合を、実際のノーツ数へ換算するためです。\n\nリザルト画面に表示されている総ノーツ数をそのまま入力してください。\n\n## Q．解析結果はゲーム公式の数値ですか？\n\nいいえ。\n\n本ツールがリザルト画像から独自に推定・算出した結果です。\n\nゲーム内部の正式な判定・評価・計算方法を取得または再現したものではありません。\n\n## Q．ランキングは公式ランキングですか？\n\nいいえ。\n\n本ツール独自の1,799件の基準データを使用したランキングです。\n\n## Q．ランキングに自分の結果は保存されますか？\n\nいいえ。\n\n今回の解析結果はランキング基準データへ保存・追加されません。\n\n画面上で1,800件目として一時的に比較・表示されます。\n\n## Q．X共有すると、リザルト画像も投稿されますか？\n\nいいえ。\n\nX共有では解析結果をもとにした投稿文とWebアプリURLを作成します。\n\nアップロードした画像そのものをXへ自動投稿する機能はありません。\n\n## Q．解析に失敗した場合はどうすればよいですか？\n\nまず、次を確認してください。\n\n1. 対応する新ライブUIのリザルトか\n2. 対象となるライブ・リザルト条件を満たしているか\n3. 棒グラフがはっきり表示されているか\n4. 画像を加工していないか\n5. 画像の解像度が十分か\n6. 総ノーツ数が正しいか\n\n条件を満たしていても、画像の状態などによって正しく解析できない場合があります。\n\n---\n\n# ⚠️ 15．ご利用上の注意\n\n## 解析結果は推定値です\n\n本ツールは、利用者が用意したリザルト画像を独自の方法で解析して結果を推定します。\n\nゲーム内部の正式な判定データを取得・改変するものではありません。\n\nそのため、\n\n- 判定分布\n- Achievement\n- Precision\n- Balance\n- Overall Score\n- Rank\n- ランキング\n\nなどは、本ツール独自の解析・評価結果です。\n\nゲーム公式の数値・評価・ランキングではありません。\n\n## 入力内容を確認してください\n\n特に総ノーツ数は解析結果に影響するため、入力間違いがないか確認してください。\n\n## 個人情報に注意してください\n\nアップロードする画像に、個人を特定できる情報などが含まれていないか、アップロード前に確認してください。\n\n第三者が公開した画像を使用する場合は、第三者の権利や利用条件にも配慮してください。\n\n---\n\n# 🔒 16．プライバシーについて\n\n本サービスでは、主に以下の情報を解析のために利用します。\n\n- アップロードされたリザルト画像\n- 入力された楽曲名\n- 難易度\n- レベル\n- 総ノーツ数\n- 解析によって生成された結果\n\nアップロードされた画像は、解析および解析結果の表示のために一時的に取り扱います。\n\n解析処理のために作成した一時ファイルは、処理後に削除する処理を行います。\n\n本アプリには、アップロード画像や解析結果をユーザー履歴として継続的に保存する機能はありません。\n\nまた、解析結果をランキング基準データへ自動的に追加する機能もありません。\n\nただし、ブラウザやホスティング基盤側で行われるログ・キャッシュその他の取り扱いについては、本アプリの実装だけで保証するものではありません。\n\n---\n\n# 📜 17．利用規約・ガイドライン\n\n本サービスの利用にあたっては、以下の点に注意してください。\n\n- 不正な目的で利用しないでください。\n- サービスへ過度な負荷を与える行為を行わないでください。\n- 正常な動作を妨害する行為を行わないでください。\n- 不正アクセスを試みないでください。\n- 第三者の権利を侵害しないでください。\n- サービスの運営を妨げる行為を行わないでください。\n\nゲームおよび関連する名称、画像、ロゴ、キャラクター等の権利は、それぞれの権利者に帰属します。\n\n本ツールはそれらの権利を取得するものではありません。\n\nサービス内容は、メンテナンス、障害、仕様変更その他の事情により変更または停止される場合があります。\n\n---\n\n# 🎮 非公式ファンメイドツールについて\n\n本ツールは、\n\n**『あんさんぶるスターズ！！Music』の非公式ファンメイドツールです。**\n\nHappy Elements株式会社およびその関連会社等とは関係ありません。\n\n『あんさんぶるスターズ！！Music』および関連する名称・コンテンツ等の権利は、それぞれの権利者に帰属します。\n\n本ツールはゲーム公式の機能・サービスではありません。\n\n\n\n---\n\n# 2.0 Final — v2〜v7統合版\n\n本リリースでは、v2〜v7で追加・改善したリザルトカードの表示要素を統合し、解析エンジンと学習済みYOLOモデルは今回提供されたプロジェクトを基準に維持しています。\n\n## リザルトカード仕様\n\n- 画像サイズ：**1600 × 1200 px（横：縦＝4：3）**\n- 濃紺・シアン基調のデザイン\n- 総合評価スコアとランクを大きく表示し、ランクに応じて色を変更\n- 右上に**円グラフ**を配置\n- 円グラフの凡例に判定数と割合を併記\n- 判定内訳はAMAZING+・AMAZINGを表示し、PERFECT以下は「PERFECT以下：0」に集約\n- 精密度・安定度は6段階のダイヤモンドで表示\n- 達成率はAMAZING+ × 1.01、AMAZING × 1.00で計算。カードには「達成率」とだけ表示し、計算式は掲載しない\n- ランキング称号は称号画像で表示。順位・上位率は補助情報として控えめに表示\n- 1,799件の基準データに今回の結果を加えた1,800件平均と解析日を表示\n- SLOW / FASTの件数・比率、解析コメントを維持\n- プレイ傾向バッジと1,800件の分布グラフは表示しない\n- 免責事項：\n  「※判定内訳・各スコアは解析結果から推定した値です。公式アプリが表示する値ではありません。本ツールは非公式ファンメイドツールです。」\n\n## レベル表記\n\nSpecialでは31+までの数値レベルに加え、♪1〜♪6を選択できます。カード上では「Lv.♪2」の形式で表示します。\n\n## 主な変更ファイル\n\n- `src/result_card.py`：1600×1200の統合リザルトカード描画\n- `src/score.py`：達成率をAMAZING+／AMAZINGの重み付けに統一\n- `app.py`：1,800件平均の算出とカードへの解析日・ランキング情報の受け渡し\n- `src/config.py`：アプリバージョンを2.0 Finalへ更新\n- `assets/result_card.png`：統合版リザルトカードのプレビュー\n\n## 解析上の注意\n\n判定内訳・各スコア・ランキングは画像解析および本ツールの基準データから推定・算出した値です。ゲーム公式アプリの内部値や公式ランキングではありません。\n\n---\n\n## 3.0.0-dev 開発状況（2026年11月7日）\n\n本リポジトリは2.0 Finalを基準に、3.0への安全な移行を開始しています。現段階では解析モデル、評価計算、ランク境界、ランキング基準データ、リザルトカードのデザインは維持し、同時利用時の一時ファイル競合、日時のタイムゾーン、判定バリデーション、回帰テストを先に整備しています。\n\n開発方針と変更範囲は [`DEVELOPMENT_PLAN_v3.md`](DEVELOPMENT_PLAN_v3.md)、変更履歴は [`CHANGELOG_v3.0.0-dev.md`](CHANGELOG_v3.0.0-dev.md) を参照してください。\n";
